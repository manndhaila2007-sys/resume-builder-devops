<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Resume Builder</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>🚀 Resume Builder Pro</h1>
      <p>A simple DevOps college project</p>
    </header>

    <main class="main-content">
      <section class="form-section">
        <h2>Enter Your Details</h2>
        <form id="resume-form">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="e.g. John Doe" required>
          </div>
          
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="e.g. john@example.com" required>
          </div>
          
          <div class="form-group">
            <label for="education">Education</label>
            <textarea id="education" rows="3" placeholder="e.g. B.Tech in Computer Science" required></textarea>
          </div>
          
          <div class="form-group">
            <label for="experience">Experience</label>
            <textarea id="experience" rows="4" placeholder="e.g. Software Engineer Intern at XYZ" required></textarea>
          </div>

          <button type="submit" class="btn-primary">Generate Resume</button>
        </form>
      </section>

      <section class="preview-section">
        <h2>Live Preview</h2>
        <div class="resume-preview" id="resume-preview">
          <p class="placeholder-text">Your resume will appear here...</p>
        </div>
        <button id="print-btn" class="btn-secondary" style="display: none;">🖨️ Print / Save as PDF</button>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
